<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070b12">
<title>RP City Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#17294c 0,#090e18 40%,#05070c 100%);
  color:#fff;
  min-height:100vh;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1150px,calc(100% - 30px));
  margin:auto;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,8,14,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.header{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:1000;
  letter-spacing:2px;
}

.logo span{
  color:#6598ff;
}

/* PING */

.ping{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 13px;
  border-radius:999px;
  background:#0d141f;
  border:1px solid rgba(255,255,255,.08);
  color:#b9c4d5;
  font-size:12px;
  direction:ltr;
}

.ping-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 12px rgba(34,197,94,.8);
}

.ping-dot.bad{
  background:#ef4444;
  box-shadow:0 0 12px rgba(239,68,68,.8);
}

.ping-dot.warn{
  background:#f59e0b;
  box-shadow:0 0 12px rgba(245,158,11,.8);
}

/* ================= HERO ================= */

.hero{
  margin-top:30px;
  padding:65px 25px;
  text-align:center;
  border-radius:28px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(
      135deg,
      rgba(45,76,135,.42),
      rgba(8,13,23,.72)
    );
  box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.badge{
  display:inline-block;
  padding:7px 14px;
  border-radius:999px;
  background:rgba(80,130,255,.1);
  border:1px solid rgba(100,150,255,.18);
  color:#9ebeff;
  font-size:11px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(38px,7vw,70px);
  font-weight:1000;
}

.hero h1 span{
  color:#6598ff;
}

.hero p{
  margin-top:15px;
  color:#8996aa;
  line-height:2;
  font-size:14px;
}

/* ================= ACTIONS ================= */

.actions{
  display:flex;
  gap:10px;
  margin:25px 0 15px;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  height:48px;
  padding:0 16px;
  border-radius:14px;
  outline:none;
  border:1px solid rgba(255,255,255,.08);
  background:#0d141f;
  color:#fff;
}

.search input:focus{
  border-color:#5c8fff;
  box-shadow:0 0 0 3px rgba(92,143,255,.09);
}

.btn{
  min-height:48px;
  padding:0 18px;
  border-radius:14px;
  border:0;
  color:#fff;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.primary{
  background:linear-gradient(135deg,#477cff,#6d9cff);
  box-shadow:0 10px 25px rgba(71,124,255,.18);
}

.secondary{
  background:#111925;
  border:1px solid rgba(255,255,255,.08);
}

/* ================= CATEGORIES ================= */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 12px;
}

.categories::-webkit-scrollbar{
  height:4px;
}

.categories button{
  white-space:nowrap;
  color:#99a6b9;
  background:#0c131d;
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:10px 16px;
}

.categories button.active{
  color:#fff;
  background:#477cff;
  border-color:#477cff;
}

/* ================= TITLE ================= */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 0 17px;
}

.section-title h2{
  font-size:20px;
}

.count{
  color:#6f7d91;
  font-size:12px;
}

/* ================= PRODUCTS ================= */

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.card{
  padding:20px;
  min-height:255px;
  display:flex;
  flex-direction:column;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.07);
  background:
    linear-gradient(145deg,#101722,#090e16);
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:rgba(91,139,255,.3);
  box-shadow:0 22px 50px rgba(0,0,0,.28);
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}

.icon{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:rgba(71,124,255,.1);
  border:1px solid rgba(71,124,255,.15);
  font-size:21px;
}

.category{
  font-size:10px;
  color:#8b99ad;
  background:#151d29;
  border-radius:999px;
  padding:6px 9px;
}

.card h3{
  margin-top:20px;
  font-size:17px;
}

.description{
  margin-top:8px;
  color:#808da1;
  font-size:12px;
  line-height:1.9;
  min-height:44px;
}

.price{
  margin-top:auto;
  padding-top:17px;
  color:#72a0ff;
  font-size:20px;
  font-weight:1000;
}

.seller{
  color:#68768a;
  font-size:11px;
  margin-top:6px;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.card-actions .btn{
  flex:1;
  min-height:42px;
  padding:0 10px;
  font-size:12px;
}

.delete{
  background:#35161b;
  color:#ff9ba5;
  border:1px solid rgba(255,80,100,.12);
}

/* ================= EMPTY ================= */

.empty{
  grid-column:1/-1;
  padding:55px 20px;
  text-align:center;
  color:#738096;
  border:1px dashed rgba(255,255,255,.1);
  border-radius:20px;
}

/* ================= LOADING ================= */

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:50px;
  color:#7d8a9e;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  padding:23px;
  border-radius:23px;
  background:#0c131d;
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 30px 90px rgba(0,0,0,.55);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:#171f2b;
  color:#fff;
  font-size:21px;
}

.group{
  margin-bottom:15px;
}

.group label{
  display:block;
  margin-bottom:7px;
  color:#aab5c6;
  font-size:12px;
}

.group input,
.group select,
.group textarea{
  width:100%;
  padding:13px;
  outline:none;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.08);
  background:#080d15;
  color:#fff;
}

.group input:focus,
.group select:focus,
.group textarea:focus{
  border-color:#477cff;
}

.group textarea{
  min-height:100px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.submit{
  width:100%;
  margin-top:5px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  z-index:500;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:12px 18px;
  border-radius:13px;
  background:#151e2b;
  border:1px solid rgba(255,255,255,.1);
  font-size:12px;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  color:#566377;
  font-size:11px;
  padding:45px 15px 25px;
}

footer a{
  color:#6f9dff;
  text-decoration:none;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .products{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:560px){

  .container{
    width:calc(100% - 20px);
  }

  .header{
    min-height:62px;
  }

  .logo{
    font-size:18px;
  }

  .ping{
    font-size:10px;
    padding:8px 10px;
  }

  .hero{
    margin-top:20px;
    padding:42px 17px;
  }

  .hero h1{
    font-size:38px;
  }

  .actions{
    flex-direction:column;
  }

  .actions .btn{
    width:100%;
  }

  .products{
    grid-template-columns:1fr;
  }

  .row{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>
  <div class="container header">

    <div class="logo">
      RP <span>CITY</span>
    </div>

    <div class="ping" dir="ltr">
      <span class="ping-dot" id="pingDot"></span>
      <span id="pingValue">Ping: -- ms</span>
    </div>

  </div>
</header>


<main class="container">

  <section class="hero">

    <div class="badge">
      RP CITY MARKET
    </div>

    <h1>
      RP City <span>Market</span>
    </h1>

    <p>
      بازار خرید و فروش آیتم‌های RP City
      <br>
      سریع، ساده و امن
    </p>

  </section>


  <div class="actions">

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="جستجوی محصول..."
      >
    </div>

    <button
      class="btn primary"
      id="openAdd"
    >
      + ثبت محصول
    </button>

    <button
      class="btn secondary"
      id="refresh"
    >
      ↻ بروزرسانی
    </button>

  </div>


  <div class="categories" id="categories">

    <button
      class="active"
      data-category="all"
    >
      همه
    </button>

    <button data-category="coin">
      سکه
    </button>

    <button data-category="car">
      ماشین
    </button>

    <button data-category="house">
      خانه
    </button>

    <button data-category="item">
      آیتم
    </button>

    <button data-category="other">
      سایر
    </button>

  </div>


  <div class="section-title">

    <h2>
      محصولات
    </h2>

    <span
      class="count"
      id="count"
    >
      0 محصول
    </span>

  </div>


  <section
    class="products"
    id="products"
  >
    <div class="loading">
      در حال دریافت محصولات...
    </div>
  </section>

</main>


<footer>

  RP City Market © 2026

  <br><br>

  پشتیبانی:

  <a
    href="https://ble.ir/rpcity_lor"
    target="_blank"
    rel="noopener"
  >
    @rpcity_lor
  </a>

</footer>


<!-- MODAL -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h3>
        ثبت محصول جدید
      </h3>

      <button
        class="close"
        id="close"
      >
        ×
      </button>

    </div>


    <form id="form">

      <div class="group">

        <label>
          نام محصول
        </label>

        <input
          id="name"
          type="text"
          placeholder="نام محصول"
          required
        >

      </div>


      <div class="row">

        <div class="group">

          <label>
            قیمت
          </label>

          <input
            id="price"
            type="number"
            min="0"
            placeholder="50000"
            required
          >

        </div>


        <div class="group">

          <label>
            دسته‌بندی
          </label>

          <select id="category">

            <option value="coin">
              سکه
            </option>

            <option value="car">
              ماشین
            </option>

            <option value="house">
              خانه
            </option>

            <option value="item">
              آیتم
            </option>

            <option value="other">
              سایر
            </option>

          </select>

        </div>

      </div>


      <div class="group">

        <label>
          آیدی فروشنده
        </label>

        <input
          id="seller"
          type="text"
          placeholder="@username"
          required
        >

      </div>


      <div class="group">

        <label>
          توضیحات
        </label>

        <textarea
          id="description"
          placeholder="توضیحات محصول..."
        ></textarea>

      </div>


      <button
        class="btn primary submit"
        id="submit"
        type="submit"
      >
        ثبت محصول
      </button>

    </form>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_PUBLISHABLE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";

let db = null;

if(
  SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
  SUPABASE_PUBLISHABLE_KEY !==
  "YOUR_SUPABASE_PUBLISHABLE_KEY"
){

  db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

}


/* =========================================================
   VARIABLES
   ========================================================= */

let products = [];
let currentCategory = "all";
let user = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const productsBox =
  document.getElementById("products");

const countBox =
  document.getElementById("count");

const searchBox =
  document.getElementById("search");

const modal =
  document.getElementById("modal");

const form =
  document.getElementById("form");

const submit =
  document.getElementById("submit");


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(text){

  const box =
    document.getElementById("toast");

  box.textContent = text;

  box.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      ()=>{
        box.classList.remove("show");
      },
      3000
    );

}


/* =========================================================
   REAL HTTP PING
   ========================================================= */

async function realPing(){

  const value =
    document.getElementById("pingValue");

  const dot =
    document.getElementById("pingDot");

  const start =
    performance.now();

  try{

    /*
      این درخواست به همان سروری می‌رود
      که سایت از آن سرو می‌شود.
      مقدار ms زمان واقعی رفت‌وبرگشت HTTP است.
    */

    const url =
      window.location.origin +
      "/?ping=" +
      Date.now() +
      "-" +
      Math.random();

    await fetch(
      url,
      {
        method:"HEAD",
        cache:"no-store",
        credentials:"same-origin"
      }
    );

    const ms =
      Math.max(
        1,
        Math.round(
          performance.now() - start
        )
      );

    value.textContent =
      "Ping: " + ms + " ms";

    dot.classList.remove("bad");

    dot.classList.remove("warn");

    if(ms > 200){

      dot.classList.add("bad");

    }else if(ms > 100){

      dot.classList.add("warn");

    }

  }catch(error){

    value.textContent =
      "Ping: -- ms";

    dot.classList.remove("warn");

    dot.classList.add("bad");

  }

}


/* شروع Ping */

realPing();


/*
  هر 10 ثانیه دوباره اندازه‌گیری می‌شود.
*/

setInterval(
  realPing,
  10000
);


/* =========================================================
   AUTH
   ========================================================= */

async function initAuth(){

  if(!db){

    showToast(
      "اطلاعات Supabase را وارد کن."
    );

    return;

  }

  try{

    const session =
      await db.auth.getSession();

    user =
      session.data.session?.user ||
      null;


    if(!user){

      const result =
        await db.auth.signInAnonymously();

      if(result.error){
        throw result.error;
      }

      user =
        result.data.user;

    }

  }catch(error){

    console.error(error);

    showToast(
      "اتصال به Supabase انجام نشد."
    );

  }

}


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

async function loadProducts(){

  if(!db){

    productsBox.innerHTML = `
      <div class="empty">
        ابتدا اطلاعات Supabase را داخل کد وارد کن.
      </div>
    `;

    return;

  }


  productsBox.innerHTML = `
    <div class="loading">
      در حال دریافت محصولات...
    </div>
  `;


  try{

    const result =
      await db
        .from("products")
        .select(`
          id,
          owner_id,
          name,
          price,
          category,
          seller_id,
          description,
          created_at
        `)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){
      throw result.error;
    }


    products =
      result.data || [];


    /*
      حذف نمایش محصولات نمونه قبلی
    */

    products =
      products.filter(
        product => {

          const name =
            String(
              product.name || ""
            )
            .trim()
            .toLowerCase();

          return ![
            "50k coin",
            "100k coin",
            "200k coin"
          ].includes(name);

        }
      );


    render();

  }catch(error){

    console.error(error);

    productsBox.innerHTML = `
      <div class="empty">
        خطا در دریافت محصولات.
      </div>
    `;

  }

}


/* =========================================================
   CATEGORY
   ========================================================= */

function categoryTitle(category){

  const map = {
    coin:"سکه",
    car:"ماشین",
    house:"خانه",
    item:"آیتم",
    other:"سایر"
  };

  return map[category] || "سایر";

}


function categoryIcon(category){

  const map = {
    coin:"🪙",
    car:"🚗",
    house:"🏠",
    item:"📦",
    other:"✨"
  };

  return map[category] || "📦";

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   FILTER
   ========================================================= */

function filtered(){

  const text =
    searchBox.value
      .trim()
      .toLowerCase();


  return products.filter(
    product => {

      const name =
        String(
          product.name || ""
        ).toLowerCase();

      const description =
        String(
          product.description || ""
        ).toLowerCase();

      const seller =
        String(
          product.seller_id || ""
        ).toLowerCase();


      const searchMatch =
        !text ||
        name.includes(text) ||
        description.includes(text) ||
        seller.includes(text);


      const categoryMatch =
        currentCategory === "all" ||
        product.category ===
        currentCategory;


      return (
        searchMatch &&
        categoryMatch
      );

    }
  );

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const list =
    filtered();


  countBox.textContent =
    `${list.length} محصول`;


  if(!list.length){

    productsBox.innerHTML = `
      <div class="empty">
        محصولی پیدا نشد.
      </div>
    `;

    return;

  }


  productsBox.innerHTML =
    list.map(
      product => {

        const price =
          Number(
            product.price || 0
          )
          .toLocaleString("fa-IR");


        const canDelete =
          user &&
          product.owner_id ===
          user.id;


        return `

          <article class="card">

            <div class="card-top">

              <div class="icon">
                ${categoryIcon(
                  product.category
                )}
              </div>

              <span class="category">
                ${escapeHTML(
                  categoryTitle(
                    product.category
                  )
                )}
              </span>

            </div>


            <h3>
              ${escapeHTML(
                product.name ||
                "بدون نام"
              )}
            </h3>


            <div class="description">
              ${escapeHTML(
                product.description ||
                "بدون توضیحات"
              )}
            </div>


            <div class="price">
              ${price} تومان
            </div>


            <div class="seller">
              فروشنده:
              ${escapeHTML(
                product.seller_id ||
                "-"
              )}
            </div>


            <div class="card-actions">

              <button
                class="btn primary"
                onclick="buyProduct('${product.id}')"
              >
                خرید محصول
              </button>


              ${
                canDelete
                ?
                `
                  <button
                    class="btn delete"
                    onclick="deleteProduct('${product.id}')"
                  >
                    حذف
                  </button>
                `
                :
                ""
              }

            </div>

          </article>

        `;

      }
    ).join("");

}


/* =========================================================
   BUY
   ========================================================= */

window.buyProduct =
function(id){

  const product =
    products.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!product){

    showToast(
      "محصول پیدا نشد."
    );

    return;

  }


  let seller =
    String(
      product.seller_id || ""
    ).trim();


  if(!seller){

    showToast(
      "آیدی فروشنده ثبت نشده."
    );

    return;

  }


  if(seller.startsWith("@")){

    seller =
      seller.substring(1);

  }


  window.open(
    "https://rubika.ir/" +
    encodeURIComponent(seller),
    "_blank",
    "noopener"
  );

};


/* =========================================================
   DELETE
   ========================================================= */

window.deleteProduct =
async function(id){

  if(!db || !user){

    showToast(
      "حساب کاربری آماده نیست."
    );

    return;

  }


  const product =
    products.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!product){

    return;

  }


  if(
    product.owner_id !==
    user.id
  ){

    showToast(
      "فقط صاحب محصول می‌تواند حذف کند."
    );

    return;

  }


  if(
    !confirm(
      `محصول «${product.name}» حذف شود؟`
    )
  ){

    return;

  }


  try{

    const result =
      await db
        .from("products")
        .delete()
        .eq("id",id)
        .eq(
          "owner_id",
          user.id
        );


    if(result.error){
      throw result.error;
    }


    showToast(
      "محصول حذف شد."
    );


    await loadProducts();

  }catch(error){

    console.error(error);

    showToast(
      "حذف محصول انجام نشد."
    );

  }

};

/* =========================================================
   ADD PRODUCT
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(!db || !user){

      showToast(
        "اتصال Supabase آماده نیست."
      );

      return;

    }


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const price =
      Number(
        document
          .getElementById("price")
          .value
      );


    const category =
      document
        .getElementById("category")
        .value;


    const seller =
      document
        .getElementById("seller")
        .value
        .trim();


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    if(!name){

      showToast(
        "نام محصول را وارد کن."
      );

      return;

    }


    if(
      !Number.isFinite(price) ||
      price < 0
    ){

      showToast(
        "قیمت صحیح نیست."
      );

      return;

    }


    if(!seller){

      showToast(
        "آیدی فروشنده را وارد کن."
      );

      return;

    }


    submit.disabled = true;

    submit.textContent =
      "در حال ثبت...";


    try{

      const result =
        await db
          .from("products")
          .insert({

            owner_id:
              user.id,

            name:
              name,

            price:
              price,

            category:
              category,

            seller_id:
              seller,

            description:
              description

          });


      if(result.error){
        throw result.error;
      }


      form.reset();

      modal.classList.remove(
        "show"
      );


      showToast(
        "محصول با موفقیت ثبت شد."
      );


      await loadProducts();

    }catch(error){

      console.error(error);

      showToast(
        error.message ||
        "ثبت محصول انجام نشد."
      );

    }finally{

      submit.disabled = false;

      submit.textContent =
        "ثبت محصول";

    }

  }
);
