<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>RP City Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 min-height:100%;
}

body{
 font-family:Tahoma,Arial,sans-serif;
 background:#08090d;
 color:#fff;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:17px 6%;
 background:#0b0c11;
 border-bottom:1px solid #20222b;
}

.logo{
 font-size:25px;
 font-weight:900;
 letter-spacing:2px;
}

.logo span{
 color:#7c5cff;
}

.ping{
 padding:9px 14px;
 background:#12141b;
 border:1px solid #272a35;
 border-radius:13px;
 font-size:13px;
}

#pingValue{
 color:#62ff9a;
 font-weight:bold;
}

main{
 width:100%;
 max-width:1150px;
 margin:auto;
 padding:35px 16px;
}

.hero{
 text-align:center;
 padding:35px 10px 45px;
}

.hero h1{
 margin:0 0 12px;
 font-size:clamp(36px,8vw,68px);
 font-weight:900;
}

.hero h1 span{
 color:#7c5cff;
}

.hero p{
 margin:0;
 color:#969bab;
 font-size:15px;
}

.status{
 display:inline-block;
 margin-top:20px;
 padding:9px 16px;
 border-radius:25px;
 background:#0d2117;
 color:#62ff9a;
 font-size:13px;
}

.panel{
 background:#0e1016;
 border:1px solid #20232d;
 border-radius:21px;
 padding:21px;
 margin-bottom:22px;
}

.panel h2{
 margin-top:0;
}

.form{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

input,select,textarea{
 width:100%;
 border:1px solid #292c38;
 background:#080a0f;
 color:#fff;
 border-radius:13px;
 padding:14px;
 outline:none;
 font-family:inherit;
 font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
 border-color:#7c5cff;
}

textarea{
 min-height:100px;
 resize:vertical;
 grid-column:1/-1;
}

button{
 border:0;
 cursor:pointer;
 border-radius:13px;
 padding:14px;
 font-family:inherit;
 font-weight:bold;
}

.add{
 grid-column:1/-1;
 background:#7c5cff;
 color:white;
}

.add:hover{
 opacity:.9;
}

.controls{
 display:grid;
 grid-template-columns:1fr 190px;
 gap:10px;
 margin-bottom:18px;
}

.products{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
 gap:15px;
}

.card{
 background:#101219;
 border:1px solid #242733;
 border-radius:18px;
 padding:18px;
 transition:.2s;
}

.card:hover{
 transform:translateY(-3px);
 border-color:#5140a5;
}

.card h3{
 margin:0 0 10px;
 font-size:18px;
}

.price{
 margin:10px 0;
 color:#8e78ff;
 font-size:22px;
 font-weight:900;
}

.meta{
 margin:7px 0;
 color:#969bab;
 font-size:12px;
}

.desc{
 min-height:45px;
 color:#c6c8d1;
 font-size:13px;
 line-height:1.9;
}

.buy{
 width:100%;
 margin-top:12px;
 background:#28213f;
 color:#fff;
}

.buy:hover{
 background:#342b52;
}

.delete{
 width:100%;
 margin-top:7px;
 background:#29151a;
 color:#ff7585;
}

.empty{
 display:none;
 text-align:center;
 padding:45px 10px;
 color:#777c8b;
}

footer{
 margin-top:30px;
 padding:35px 15px;
 text-align:center;
 color:#777c8b;
 border-top:1px solid #20222b;
}

footer a{
 color:#8e78ff;
 text-decoration:none;
}

#offline{
 display:none;
 margin:0 16px 10px;
 padding:10px 14px;
 text-align:center;
 background:#1b1710;
 color:#ffd27a;
 border:1px solid #443820;
 border-radius:12px;
 font-size:12px;
}

@media(max-width:650px){

 header{
  padding:15px;
 }

 main{
  padding:25px 12px;
 }

 .form{
  grid-template-columns:1fr;
 }

 textarea,
 .add{
  grid-column:auto;
 }

 .controls{
  grid-template-columns:1fr;
 }

}
</style>
</head>

<body>

<header>
 <div class="logo">RP <span>CITY</span></div>

 <div class="ping">
  PING:
  <span id="pingValue">...</span>
 </div>
</header>

<div id="offline">
 اتصال آنلاین موقتاً در دسترس نیست؛ سایت در حالت آفلاین فعال است.
</div>

<main>

<section class="hero">

 <h1>
  RP City <span>Market</span>
 </h1>

 <p>
  بازار خرید و فروش محصولات RP City
 </p>

 <div class="status">
  ● بازار فعال RP City
 </div>

</section>


<section class="panel">

 <h2>➕ ثبت محصول</h2>

 <div class="form">

  <input
   id="name"
   type="text"
   placeholder="نام محصول"
  >

  <input
   id="price"
   type="number"
   placeholder="قیمت به تومان"
  >

  <select id="category">
   <option value="سکه">🪙 سکه</option>
   <option value="آیتم">📦 آیتم</option>
   <option value="اکانت">👤 اکانت</option>
   <option value="سایر">⭐ سایر</option>
  </select>

  <input
   id="seller"
   type="text"
   placeholder="آیدی روبیکا فروشنده"
  >

  <textarea
   id="description"
   placeholder="توضیحات محصول"
  ></textarea>

  <button
   class="add"
   id="addButton"
   onclick="addProduct()"
  >
   ثبت محصول
  </button>

 </div>

</section>


<section class="panel">

 <div class="controls">

  <input
   id="search"
   type="text"
   placeholder="🔎 جستجوی محصول..."
   oninput="renderProducts()"
  >

  <select
   id="filter"
   onchange="renderProducts()"
  >
   <option value="همه">همه دسته‌ها</option>
   <option value="سکه">🪙 سکه</option>
   <option value="آیتم">📦 آیتم</option>
   <option value="اکانت">👤 اکانت</option>
   <option value="سایر">⭐ سایر</option>
  </select>

 </div>

 <div
  id="products"
  class="products"
 ></div>

 <div
  id="empty"
  class="empty"
 >
  محصولی پیدا نشد.
 </div>

</section>

</main>


<footer>

 RP City Market

 <br><br>

 پشتیبانی:

 <a
  href="https://ble.ir/rpcity_lor"
  target="_blank"
  rel="noopener"
 >
  @rpcity_lor
 </a>

</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cjntwmohtwbfqtxlgxrt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_mvO9kjx83dBLbsea0C7sAg_O4hHBRL9";

let supabaseClient=null;
let onlineDatabase=false;
let currentUser=null;
let products=[];


/* =========================
   LOCAL STORAGE
========================= */

const LOCAL_KEY="rpcity_market_products";


function getLocalProducts(){

 try{

  const data=
   localStorage.getItem(LOCAL_KEY);

  if(!data) return [];

  const parsed=JSON.parse(data);

  return Array.isArray(parsed)
   ? parsed
   : [];

 }catch(e){

  return [];

 }

}


function saveLocalProducts(){

 try{

  localStorage.setItem(
   LOCAL_KEY,
   JSON.stringify(products)
  );

 }catch(e){}

}


/* =========================
   SUPABASE INIT
========================= */

function initSupabase(){

 try{

  if(
   !window.supabase ||
   !window.supabase.createClient
  ){

   return false;

  }

  supabaseClient=
   window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
     auth:{
      autoRefreshToken:true,
      persistSession:true,
      detectSessionInUrl:true
     }
    }
   );

  return true;

 }catch(e){

  console.log("Supabase unavailable",e);

  return false;

 }

}


/* =========================
   ANONYMOUS AUTH
========================= */

async function initAuth(){

 if(!supabaseClient){
  return false;
 }

 try{

  const sessionResult=
   await supabaseClient.auth.getSession();

  if(
   sessionResult &&
   sessionResult.data &&
   sessionResult.data.session
  ){

   currentUser=
    sessionResult.data.session.user;

   onlineDatabase=true;

   return true;

  }


  const result=
   await supabaseClient.auth.signInAnonymously();


  if(
   result &&
   result.data &&
   result.data.user
  ){

   currentUser=result.data.user;

   onlineDatabase=true;

   return true;

  }


  return false;

 }catch(e){

  console.log(
   "Anonymous auth unavailable",
   e
  );

  return false;

 }

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

 let remoteLoaded=false;

 if(
  supabaseClient &&
  onlineDatabase
 ){

  try{

   const result=
    await supabaseClient
    .from("products")
    .select(`
     id,
     owner_id,
     name,
     price,
     category,
     seller_id,
     description,
     created_at
    `)
    .order(
     "created_at",
     {ascending:false}
    );


   if(
    !result.error &&
    Array.isArray(result.data)
   ){

    products=
     result.data.filter(function(item){

      const name=
       String(item.name || "")
       .toLowerCase();

      return ![
       "50k coin",
       "100k coin",
       "200k coin"
      ].includes(name);

     });

    remoteLoaded=true;

   }

  }catch(e){

   console.log(
    "Database load failed",
    e
   );

  }

 }


 if(!remoteLoaded){

  products=
   getLocalProducts();

  document
   .getElementById("offline")
   .style.display="block";

 }else{

  document
   .getElementById("offline")
   .style.display="none";

 }

 renderProducts();

}


/* =========================
   RENDER
========================= */

function renderProducts(){

 const container=
  document.getElementById("products");

 const empty=
  document.getElementById("empty");

 const search=
  document.getElementById("search")
  .value
  .trim()
  .toLowerCase();

 const filter=
  document.getElementById("filter")
  .value;


 const list=
  products.filter(function(product){

   const text=(
    String(product.name || "")+
    " "+
    String(product.description || "")+
    " "+
    String(product.seller_id || "")
   ).toLowerCase();


   const searchOK=
    !search ||
    text.includes(search);


   const categoryOK=
    filter==="همه" ||
    product.category===filter;


   return searchOK && categoryOK;

  });


 container.innerHTML="";


 if(!list.length){

  empty.style.display="block";

  return;

 }


 empty.style.display="none";


 list.forEach(function(product){

  container.appendChild(
   createCard(product)
  );

 });

}


/* =========================
   CARD
========================= */

function createCard(product){

 const card=
  document.createElement("div");

 card.className="card";


 const name=
  escapeHtml(
   product.name || "بدون نام"
  );


 const category=
  escapeHtml(
   product.category || "سایر"
  );


 const description=
  escapeHtml(
   product.description ||
   "بدون توضیحات"
  );


 const seller=
  escapeHtml(
   product.seller_id || ""
  );


 const price=
  Number(product.price || 0)
  .toLocaleString("fa-IR");


 card.innerHTML=`

  <h3>${name}</h3>

  <div class="meta">
   دسته: ${category}
  </div>

  <div class="price">
   ${price} تومان
  </div>

  <div class="desc">
   ${description}
  </div>

  <div class="meta">
   فروشنده:
   ${seller ? "@"+seller : "نامشخص"}
  </div>

  <button class="buy">
   🛒 خرید محصول
  </button>

  ${
   onlineDatabase &&
   currentUser &&
   product.owner_id===currentUser.id
   ?
   `<button class="delete">
      🗑 حذف محصول
    </button>`
   :
   ""
  }

 `;


 card
  .querySelector(".buy")
  .onclick=function(){

   buyProduct(
    product.seller_id
   );

  };


 const deleteButton=
  card.querySelector(".delete");


 if(deleteButton){

  deleteButton.onclick=function(){

   deleteProduct(
    product.id
   );

  };

 }


 return card;

}


/* =========================
   BUY
========================= */

function buyProduct(seller){

 if(!seller){

  return;

 }

 let id=
  String(seller).trim();


 if(id.startsWith("@")){

  id=id.substring(1);

 }


 if(!id){

  return;

 }


 window.open(
  "https://rubika.ir/"+
  encodeURIComponent(id),
  "_blank"
 );

}


/* =========================
   ADD PRODUCT
========================= */

async function addProduct(){

 const name=
  document.getElementById("name")
  .value
  .trim();


 const price=
  Number(
   document.getElementById("price")
   .value
  );


 const category=
  document.getElementById("category")
  .value;


 const seller=
  document.getElementById("seller")
  .value
  .trim();


 const description=
  document.getElementById("description")
  .value
  .trim();


 if(!name){

  return;

 }


 if(!price || price<1){

  return;

 }


 if(!seller){

  return;

 }


 const localProduct={

  id:
   "local_"+Date.now(),

  owner_id:
   currentUser
   ? currentUser.id
   : null,

  name:name,

  price:price,

  category:category,

  seller_id:seller,

  description:description,

  created_at:
   new Date().toISOString()

 };


 /* ONLINE */

 if(
  supabaseClient &&
  onlineDatabase &&
  currentUser
 ){

  try{

   const result=
    await supabaseClient
    .from("products")
    .insert({

     owner_id:
      currentUser.id,

     name:name,

     price:price,

     category:category,

     seller_id:seller,

     description:description

    })
    .select()
    .single();


   if(
    !result.error &&
    result.data
   ){

    products.unshift(
     result.data
    );

    clearForm();

    renderProducts();

    return;

   }

  }catch(e){

   console.log(
    "Online insert failed",
    e
   );

  }

 }


 /* OFFLINE FALLBACK */

 products.unshift(
  localProduct
 );

 saveLocalProducts();

 clearForm();

 renderProducts();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

 document.getElementById("name")
  .value="";

 document.getElementById("price")
  .value="";

 document.getElementById("seller")
  .value="";

 document.getElementById("description")
  .value="";

}


/* =========================
   DELETE
========================= */

async function deleteProduct(id){

 if(!id){

  return;

 }


 /* ONLINE */

 if(
  supabaseClient &&
  onlineDatabase &&
  currentUser &&
  !String(id).startsWith("local_")
 ){

  try{

   const result=
    await supabaseClient
    .from("products")
    .delete()
    .eq("id",id)
    .eq(
     "owner_id",
     currentUser.id
    );


   if(!result.error){

    products=
     products.filter(function(item){

      return item.id!==id;

     });

    renderProducts();

    return;

   }

  }catch(e){

   console.log(
    "Online delete failed",
    e
   );

  }

 }


 /* LOCAL */

 products=
  products.filter(function(item){

   return item.id!==id;

  });


 saveLocalProducts();

 renderProducts();

}


/* =========================
   PING
========================= */

async function realPing(){

 const start=
  performance.now();


 try{

  await fetch(
   window.location.origin+
   "/?ping="+
   Date.now()+
   Math.random(),
   {
    method:"HEAD",
    cache:"no-store"
   }
  );


  const ms=
   Math.round(
    performance.now()-start
   );


  document
   .getElementById("pingValue")
   .textContent=
   ms+" ms";


 }catch(e){

  document
   .getElementById("pingValue")
   .textContent=
   "—";

 }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

(async function(){

 realPing();

 setInterval(
  realPing,
  10000
 );


 const supabaseOK=
  initSupabase();


 if(supabaseOK){

  await initAuth();

 }


 await loadProducts();


})();

</script>

</body>
</html>
