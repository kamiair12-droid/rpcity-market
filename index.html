<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">

<title>RP City Market</title>

<style>

*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 padding:0;
 min-height:100%;
}

body{
 font-family:Tahoma,Arial,sans-serif;
 background:#08090d;
 color:#fff;
}

header{
 position:sticky;
 top:0;
 z-index:100;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:16px 6%;
 background:#0b0c11;
 border-bottom:1px solid #20222b;
}

.logo{
 font-size:26px;
 font-weight:900;
 letter-spacing:2px;
}

.logo span{
 color:#7c5cff;
}

.ping{
 padding:9px 14px;
 background:#12141b;
 border:1px solid #292c36;
 border-radius:13px;
 font-size:13px;
}

#pingValue{
 color:#62ff9a;
 font-weight:bold;
}

main{
 width:100%;
 max-width:1150px;
 margin:auto;
 padding:25px 15px;
}

.hero{
 text-align:center;
 padding:35px 10px 40px;
}

.hero h1{
 margin:0 0 12px;
 font-size:clamp(38px,8vw,68px);
 font-weight:900;
}

.hero h1 span{
 color:#7c5cff;
}

.hero p{
 color:#969bab;
 font-size:15px;
}

.status{
 display:inline-block;
 margin-top:15px;
 padding:10px 17px;
 border-radius:25px;
 background:#0d2117;
 color:#62ff9a;
 font-size:13px;
}

.panel{
 background:#0e1016;
 border:1px solid #20232d;
 border-radius:22px;
 padding:22px;
 margin-bottom:22px;
}

.panel h2{
 margin-top:0;
 font-size:22px;
}

.form{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

input,
select,
textarea{
 width:100%;
 border:1px solid #292c38;
 background:#080a0f;
 color:#fff;
 border-radius:14px;
 padding:15px;
 outline:none;
 font-family:inherit;
 font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
 border-color:#7c5cff;
}

textarea{
 min-height:105px;
 resize:vertical;
 grid-column:1/-1;
}

button{
 border:0;
 cursor:pointer;
 border-radius:14px;
 padding:15px;
 font-family:inherit;
 font-weight:bold;
}

.add{
 grid-column:1/-1;
 background:#7c5cff;
 color:white;
 font-size:15px;
}

.add:disabled{
 opacity:.6;
 cursor:not-allowed;
}

.controls{
 display:grid;
 grid-template-columns:1fr 190px;
 gap:10px;
 margin-bottom:18px;
}

.products{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
 gap:15px;
}

.card{
 background:#101219;
 border:1px solid #242733;
 border-radius:18px;
 padding:18px;
 transition:.2s;
}

.card:hover{
 transform:translateY(-3px);
 border-color:#5140a5;
}

.card h3{
 margin:0 0 10px;
 font-size:18px;
}

.price{
 margin:10px 0;
 color:#8e78ff;
 font-size:22px;
 font-weight:900;
}

.meta{
 margin:7px 0;
 color:#969bab;
 font-size:12px;
}

.desc{
 min-height:45px;
 color:#c6c8d1;
 font-size:13px;
 line-height:1.9;
 white-space:pre-wrap;
}

.buy{
 width:100%;
 margin-top:12px;
 background:#28213f;
 color:white;
}

.buy:hover{
 background:#342b52;
}

.empty{
 display:none;
 text-align:center;
 padding:45px 10px;
 color:#777c8b;
}

footer{
 margin-top:30px;
 padding:35px 15px;
 text-align:center;
 color:#777c8b;
 border-top:1px solid #20222b;
}

footer a{
 color:#8e78ff;
 text-decoration:none;
}

.message{
 display:none;
 margin-bottom:15px;
 padding:12px 15px;
 border-radius:13px;
 text-align:center;
 font-size:13px;
}

.message.success{
 display:block;
 background:#0d2117;
 color:#62ff9a;
 border:1px solid #214d36;
}

.message.error{
 display:block;
 background:#251316;
 color:#ff8794;
 border:1px solid #4d242b;
}

.message.info{
 display:block;
 background:#171528;
 color:#b9adff;
 border:1px solid #342d5e;
}

.loading{
 text-align:center;
 padding:30px;
 color:#888;
}

@media(max-width:650px){

 header{
  padding:15px;
 }

 main{
  padding:20px 12px;
 }

 .form{
  grid-template-columns:1fr;
 }

 textarea,
 .add{
  grid-column:auto;
 }

 .controls{
  grid-template-columns:1fr;
 }

}

</style>
</head>

<body>

<header>

 <div class="logo">
  RP <span>CITY</span>
 </div>

 <div class="ping">
  PING:
  <span id="pingValue">...</span>
 </div>

</header>


<main>

<section class="hero">

 <h1>
  RP City <span>Market</span>
 </h1>

 <p>
  بازار خرید و فروش محصولات RP City
 </p>

 <div class="status">
  ● بازار فعال RP City
 </div>

</section>


<section class="panel">

 <h2>➕ ثبت محصول</h2>

 <div id="message" class="message"></div>

 <div class="form">

  <input
   id="name"
   type="text"
   maxlength="100"
   placeholder="نام محصول"
  >

  <input
   id="price"
   type="number"
   min="0"
   placeholder="قیمت به تومان"
  >

  <select id="category">

   <option value="سکه">
    🪙 سکه
   </option>

   <option value="آیتم">
    📦 آیتم
   </option>

   <option value="اکانت">
    👤 اکانت
   </option>

   <option value="سایر">
    ⭐ سایر
   </option>

  </select>


  <input
   id="seller"
   type="text"
   maxlength="100"
   placeholder="آیدی روبیکا فروشنده"
  >


  <textarea
   id="description"
   maxlength="500"
   placeholder="توضیحات محصول"
  ></textarea>


  <button
   class="add"
   id="addButton"
   onclick="addProduct()"
  >
   ثبت محصول
  </button>

 </div>

</section>



<section class="panel">

 <div class="controls">

  <input
   id="search"
   type="text"
   placeholder="🔎 جستجوی محصول..."
   oninput="renderProducts()"
  >


  <select
   id="filter"
   onchange="renderProducts()"
  >

   <option value="همه">
    همه دسته‌ها
   </option>

   <option value="سکه">
    🪙 سکه
   </option>

   <option value="آیتم">
    📦 آیتم
   </option>

   <option value="اکانت">
    👤 اکانت
   </option>

   <option value="سایر">
    ⭐ سایر
   </option>

  </select>

 </div>


 <div
  id="products"
  class="products"
 >
 </div>


 <div
  id="loading"
  class="loading"
 >
  در حال دریافت محصولات...
 </div>


 <div
  id="empty"
  class="empty"
 >
  محصولی پیدا نشد.
 </div>

</section>

</main>



<footer>

 RP City Market

 <br><br>

 پشتیبانی:

 <a
  href="https://ble.ir/rpcity_lor"
  target="_blank"
  rel="noopener"
 >
  @rpcity_lor
 </a>

</footer>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://cjntwmohtwbfqtxlgxrt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_mvO9kjx83dBLbsea0C7sAg_O4hHBRL9";


const API_URL =
SUPABASE_URL + "/rest/v1/products";


let products = [];



/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

 const box =
  document.getElementById("message");

 box.className =
  "message " + type;

 box.textContent =
  text;

}


function hideMessage(){

 const box =
  document.getElementById("message");

 box.className =
  "message";

 box.textContent =
  "";

}



/* =========================================
   SUPABASE REQUEST
========================================= */

async function supabaseRequest(
 method,
 body=null,
 query=""
){

 const options = {

  method:method,

  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer " + SUPABASE_KEY,
   "Content-Type":"application/json",
   "Accept":"application/json"
  }

 };


 if(body !== null){

  options.headers["Prefer"] =
   "return=representation";

  options.body =
   JSON.stringify(body);

 }


 const response =
  await fetch(
   API_URL + query,
   options
  );


 const text =
  await response.text();


 let data=null;

 try{

  data =
   text ? JSON.parse(text) : null;

 }catch(e){

  data=null;

 }


 if(!response.ok){

  let errorText =
   "خطا در اتصال به سرور";

  if(data){

   errorText =
    data.message ||
    data.error_description ||
    data.hint ||
    errorText;

  }

  throw new Error(errorText);

 }


 return data;

}



/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

 const productsBox =
  document.getElementById("products");

 const loading =
  document.getElementById("loading");


 loading.style.display =
  "block";


 try{

  const data =
   await supabaseRequest(
    "GET",
    null,
    "?select=id,owner_id,name,price,category,seller_id,description,created_at&order=created_at.desc"
   );


  if(Array.isArray(data)){

   products =
    data.filter(function(item){

     const name =
      String(item.name || "")
      .trim()
      .toLowerCase();

     return ![
      "50k coin",
      "100k coin",
      "200k coin"
     ].includes(name);

    });

  }else{

   products=[];

  }


  loading.style.display =
   "none";


  renderProducts();


 }catch(error){

  console.log(error);

  loading.style.display =
   "none";


  products=[];

  renderProducts();


  showMessage(
   "اتصال به بازار برقرار نشد.",
   "error"
  );

 }

}



/* =========================================
   ADD PRODUCT
========================================= */

async function addProduct(){

 const button =
  document.getElementById("addButton");


 const name =
  document.getElementById("name")
  .value
  .trim();


 const price =
  document.getElementById("price")
  .value;


 const category =
  document.getElementById("category")
  .value;


 let seller =
  document.getElementById("seller")
  .value
  .trim();


 const description =
  document.getElementById("description")
  .value
  .trim();



 /* VALIDATION */

 if(!name){

  showMessage(
   "نام محصول را وارد کن.",
   "error"
  );

  return;

 }


 if(!price || Number(price)<0){

  showMessage(
   "قیمت محصول را درست وارد کن.",
   "error"
  );

  return;

 }


 if(!seller){

  showMessage(
   "آیدی روبیکا فروشنده را وارد کن.",
   "error"
  );

  return;

 }


 /* حذف @ از اول آیدی */

 seller =
  seller.replace(/^@+/,"");


 if(!seller){

  showMessage(
   "آیدی روبیکا معتبر نیست.",
   "error"
  );

  return;

 }


 button.disabled=true;

 button.textContent =
  "در حال ثبت...";


 hideMessage();



 try{

  const newProduct = {

   name:name,

   price:Number(price),

   category:category,

   seller_id:seller,

   description:description

  };


  const result =
   await supabaseRequest(
    "POST",
    newProduct
   );


  if(
   Array.isArray(result) &&
   result.length>0
  ){

   products.unshift(
    result[0]
   );

  }else{

   await loadProducts();

  }


  /* CLEAR FORM */

  document
   .getElementById("name")
   .value="";


  document
   .getElementById("price")
   .value="";


  document
   .getElementById("seller")
   .value="";


  document
   .getElementById("description")
   .value="";


  document
   .getElementById("category")
   .value="سکه";


  renderProducts();


  showMessage(
   "✅ محصول با موفقیت ثبت شد.",
   "success"
  );


 }catch(error){

  console.log(
   "ADD PRODUCT ERROR:",
   error
  );


  showMessage(
   "❌ ثبت محصول انجام نشد. Policy مربوط به INSERT را در Supabase بررسی کن.",
   "error"
  );

 }


 button.disabled=false;

 button.textContent =
  "ثبت محصول";

}



/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

 const container =
  document.getElementById("products");


 const empty =
  document.getElementById("empty");


 const search =
  document.getElementById("search")
  .value
  .trim()
  .toLowerCase();


 const filter =
  document.getElementById("filter")
  .value;


 const list =
  products.filter(function(product){

   const text =
    (
     String(product.name || "") +
     " " +
     String(product.description || "") +
     " " +
     String(product.seller_id || "")
    )
    .toLowerCase();


   const searchOK =
    !search ||
    text.includes(search);


   const categoryOK =
    filter === "همه" ||
    product.category === filter;


   return searchOK &&
          categoryOK;

  });


 container.innerHTML="";


 if(!list.length){

  empty.style.display =
   "block";

  return;

 }


 empty.style.display =
  "none";


 list.forEach(function(product){

  container.appendChild(
   createCard(product)
  );

 });

}



/* =========================================
   CREATE CARD
========================================= */

function createCard(product){

 const card =
  document.createElement("div");


 card.className =
  "card";


 const name =
  escapeHtml(
   product.name ||
   "بدون نام"
  );


 const category =
  escapeHtml(
   product.category ||
   "سایر"
  );


 const description =
  escapeHtml(
   product.description ||
   "بدون توضیحات"
  );


 const seller =
  escapeHtml(
   product.seller_id ||
   ""
  );


 const price =
  Number(
   product.price || 0
  )
  .toLocaleString("fa-IR");


 card.innerHTML = `

  <h3>
   ${name}
  </h3>

  <div class="meta">
   دسته: ${category}
  </div>

  <div class="price">
   ${price} تومان
  </div>

  <div class="desc">
   ${description}
  </div>

  <div class="meta">
   فروشنده:
   ${seller ? "@" + seller : "نامشخص"}
  </div>

  <button class="buy">
   🛒 خرید محصول
  </button>

 `;


 const buyButton =
  card.querySelector(".buy");


 buyButton.onclick =
  function(){

   if(!seller){

    return;

   }


   const username =
    seller.replace(/^@+/,"");


   window.open(
    "https://rubika.ir/" +
    encodeURIComponent(username),
    "_blank"
   );

  };


 return card;

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}



/* =========================================
   REAL HTTP PING
========================================= */

async function updatePing(){

 const ping =
  document.getElementById("pingValue");


 const start =
  performance.now();


 try{

  await fetch(
   SUPABASE_URL +
   "/rest/v1/products?select=id&limit=1",
   {
    method:"GET",
    headers:{
     "apikey":SUPABASE_KEY
    },
    cache:"no-store"
   }
  );


  const end =
   performance.now();


  const ms =
   Math.max(
    1,
    Math.round(end-start)
   );


  ping.textContent =
   ms + " ms";


 }catch(e){

  ping.textContent =
   "OFF";

 }

}



/* =========================================
   START
========================================= */

document.addEventListener(
 "DOMContentLoaded",
 function(){

  loadProducts();

  updatePing();

  setInterval(
   updatePing,
   10000
  );

 }
);

</script>

</body>
</html>
