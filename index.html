<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RP City Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#07090d;
  color:#fff;
  min-height:100vh;
}

button,input,textarea,select{font-family:inherit}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,9,13,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #1c222c;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{color:#00ff88}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
  background:#0d1713;
  border:1px solid #174a34;
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#00ff88;
  box-shadow:0 0 10px #00ff88;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:
    radial-gradient(circle at top right,rgba(0,255,136,.12),transparent 35%),
    linear-gradient(145deg,#0c1017,#080a0f);
  border:1px solid #1d2530;
  border-radius:24px;
  padding:35px 25px;
  margin-bottom:25px;
  text-align:center;
}

.hero h1{
  font-size:38px;
  font-weight:1000;
  margin-bottom:10px;
}

.hero h1 span{color:#00ff88}

.hero p{
  color:#929aa8;
  line-height:2;
}

.auth-box{
  max-width:430px;
  margin:70px auto;
  background:#0d1118;
  border:1px solid #202936;
  border-radius:22px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.auth-box h2{
  text-align:center;
  margin-bottom:20px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  background:#111720;
  border:1px solid #27303c;
  color:#aaa;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

.tabs button.active{
  background:#00ff88;
  color:#03110a;
  border-color:#00ff88;
  font-weight:900;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:#b8c0cc;
  margin-bottom:7px;
  font-size:13px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#080c12;
  border:1px solid #27303b;
  color:#fff;
  border-radius:11px;
  padding:13px;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#00ff88;
}

textarea{
  resize:vertical;
  min-height:90px;
}

.primary{
  width:100%;
  border:0;
  background:#00ff88;
  color:#03110a;
  font-weight:900;
  padding:14px;
  border-radius:11px;
  cursor:pointer;
}

.primary:hover{filter:brightness(1.08)}

.error{
  color:#ff6575;
  font-size:13px;
  margin-top:12px;
  text-align:center;
}

.success{
  color:#00ff88;
  font-size:13px;
  margin-top:12px;
  text-align:center;
}

.hidden{display:none!important}

.panel{
  background:#0c1016;
  border:1px solid #1d2530;
  border-radius:20px;
  padding:22px;
  margin-bottom:25px;
}

.panel-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{grid-column:1/-1}

.search-row{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search-row input{
  flex:1;
  background:#0d1118;
  border:1px solid #252e3a;
  color:#fff;
  border-radius:12px;
  padding:14px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}

.cat{
  white-space:nowrap;
  border:1px solid #29313c;
  background:#0e131a;
  color:#aaa;
  padding:9px 15px;
  border-radius:10px;
  cursor:pointer;
}

.cat.active{
  color:#06120c;
  background:#00ff88;
  border-color:#00ff88;
  font-weight:900;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.product{
  background:#0c1118;
  border:1px solid #1d2631;
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
  border-color:#00a95b;
}

.product-image{
  height:190px;
  background:#080b10;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-image{
  color:#4e5865;
  font-size:45px;
}

.product-body{
  padding:17px;
}

.badge{
  display:inline-block;
  font-size:11px;
  padding:5px 9px;
  border-radius:8px;
  background:#101a16;
  color:#00ff88;
  margin-bottom:9px;
}

.product h3{
  font-size:18px;
  margin-bottom:9px;
}

.description{
  color:#8e97a5;
  font-size:13px;
  line-height:1.9;
  min-height:45px;
  margin-bottom:12px;
}

.price{
  font-size:20px;
  font-weight:1000;
  margin-bottom:13px;
}

.price small{
  font-size:11px;
  color:#8d97a5;
}

.seller{
  color:#858f9e;
  font-size:12px;
  margin-bottom:12px;
}

.actions{
  display:flex;
  gap:8px;
}

.buy{
  flex:1;
  text-align:center;
  text-decoration:none;
  background:#00ff88;
  color:#03110a;
  padding:11px;
  border-radius:10px;
  font-weight:900;
  font-size:13px;
}

.delete{
  background:#251116;
  border:1px solid #57202b;
  color:#ff6b7c;
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
}

.support{
  background:
    radial-gradient(circle at left,#00ff8820,transparent 35%),
    #0c1218;
  border:1px solid #1e3a2d;
  border-radius:20px;
  padding:25px;
  text-align:center;
  margin-top:30px;
}

.support h2{
  margin-bottom:9px;
}

.support p{
  color:#8f99a7;
  margin-bottom:17px;
}

.support a{
  display:inline-block;
  text-decoration:none;
  background:#00ff88;
  color:#03110a;
  padding:12px 22px;
  border-radius:11px;
  font-weight:900;
}

.logout{
  background:#161b23;
  border:1px solid #2a323e;
  color:#fff;
  border-radius:10px;
  padding:9px 13px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#707987;
  padding:45px;
  border:1px dashed #29313c;
  border-radius:15px;
}

.status{
  margin-top:10px;
  font-size:13px;
  color:#7f8998;
}

@media(max-width:850px){
  .products{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  .nav{align-items:flex-start;flex-direction:column}
  .form-grid{grid-template-columns:1fr}
  .products{grid-template-columns:1fr}
  .full{grid-column:auto}
  .hero h1{font-size:29px}
  .search-row{flex-direction:column}
}
</style>
</head>

<body>

<header class="header">
  <div class="nav">
    <div class="logo">RP <span>CITY</span> MARKET</div>

    <div class="user-area">
      <div class="online">
        <span class="dot"></span>
        <span>آنلاین:</span>
        <strong id="onlineCount">0</strong>
      </div>

      <span id="currentUsername"></span>

      <button id="logoutBtn" class="logout hidden" onclick="logout()">
        خروج
      </button>
    </div>
  </div>
</header>

<main class="container">

<section id="authSection">

  <div class="auth-box">

    <h2>ورود به RP City</h2>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showLogin()">
        ورود
      </button>

      <button id="signupTab" onclick="showSignup()">
        ثبت نام
      </button>
    </div>

    <div id="loginForm">

      <div class="field">
        <label>نام کاربری</label>
        <input id="loginUsername" autocomplete="username">
      </div>

      <div class="field">
        <label>رمز عبور</label>
        <input id="loginPassword" type="password" autocomplete="current-password">
      </div>

      <button class="primary" onclick="login()">
        ورود به حساب
      </button>

      <div id="loginMessage" class="error"></div>

    </div>

    <div id="signupForm" class="hidden">

      <div class="field">
        <label>نام کاربری</label>
        <input id="signupUsername" autocomplete="username">
      </div>

      <div class="field">
        <label>رمز عبور</label>
        <input id="signupPassword" type="password" autocomplete="new-password">
      </div>

      <div class="field">
        <label>تکرار رمز عبور</label>
        <input id="signupPassword2" type="password" autocomplete="new-password">
      </div>

      <button class="primary" onclick="signup()">
        ساخت حساب
      </button>

      <div id="signupMessage" class="error"></div>

    </div>

  </div>

</section>


<section id="siteSection" class="hidden">

  <div class="hero">
    <h1>RP <span>CITY</span> MARKET</h1>
    <p>
      بازار خرید و فروش آیتم، اکانت، سکه و سایر محصولات RP City
    </p>
  </div>


  <section class="panel">

    <div class="panel-title">
      ثبت محصول جدید
    </div>

    <div class="form-grid">

      <div class="field">
        <label>نام محصول</label>
        <input id="productName" placeholder="مثلاً اکانت لول 50">
      </div>

      <div class="field">
        <label>دسته بندی</label>

        <select id="productCategory">
          <option value="آیتم">آیتم</option>
          <option value="اکانت">اکانت</option>
          <option value="سکه">سکه</option>
          <option value="سایر">سایر</option>
        </select>

      </div>

      <div class="field">
        <label>قیمت</label>
        <input id="productPrice" type="number" min="0">
      </div>

      <div class="field">
        <label>نوع قیمت</label>

        <select id="priceType">
          <option value="coin">🪙 سکه</option>
          <option value="toman">💵 تومان</option>
        </select>

      </div>

      <div class="field">
        <label>آیدی بله فروشنده</label>
        <input id="sellerId" placeholder="@username">
      </div>

      <div class="field">
        <label>تصویر محصول</label>
        <input id="productImage" type="file" accept="image/*">
      </div>

      <div class="field full">
        <label>توضیحات</label>
        <textarea id="productDescription"
          placeholder="توضیحات محصول را وارد کنید..."></textarea>
      </div>

      <div class="full">
        <button class="primary" onclick="addProduct()">
          + ثبت محصول
        </button>
      </div>

    </div>

    <div id="productMessage" class="status"></div>

  </section>


  <section>

    <div class="search-row">
      <input id="searchInput"
             placeholder="جستجوی محصول..."
             oninput="renderProducts()">
    </div>

    <div class="categories">

      <button class="cat active"
              data-category="همه"
              onclick="setCategory('همه',this)">
        همه
      </button>

      <button class="cat"
              data-category="آیتم"
              onclick="setCategory('آیتم',this)">
        🎁 آیتم
      </button>

      <button class="cat"
              data-category="اکانت"
              onclick="setCategory('اکانت',this)">
        👤 اکانت
      </button>

      <button class="cat"
              data-category="سکه"
              onclick="setCategory('سکه',this)">
        🪙 سکه
      </button>

      <button class="cat"
              data-category="سایر"
              onclick="setCategory('سایر',this)">
        📦 سایر
      </button>

    </div>

  </section>


  <section style="margin-top:20px">

    <div id="products" class="products"></div>

  </section>


  <section class="support">

    <h2>🆘 پشتیبانی RP City</h2>

    <p>
      اگر مشکلی در خرید، فروش یا حساب کاربری داشتی با پشتیبانی در ارتباط باش.
    </p>

    <a href="https://ble.ir/rpcity_lor" target="_blank">
      ارتباط با پشتیبانی
    </a>

  </section>

</section>

</main>


<script>

const SUPABASE_URL =
  "https://cjntwmohtwbfqtxlgxrt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_mvO9kjx83dBLbsea0C7sAg_O4hHBRL9";

const AUTH_FUNCTION =
  SUPABASE_URL + "/functions/v1/username-auth";

const { createClient } =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentUsername = "";
let allProducts = [];
let selectedCategory = "همه";

let onlineHeartbeat = null;
let onlineCounterTimer = null;


/* =========================
   AUTH
========================= */

function showLogin(){

  document.getElementById("loginForm")
    .classList.remove("hidden");

  document.getElementById("signupForm")
    .classList.add("hidden");

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("signupTab")
    .classList.remove("active");

}


function showSignup(){

  document.getElementById("loginForm")
    .classList.add("hidden");

  document.getElementById("signupForm")
    .classList.remove("hidden");

  document.getElementById("signupTab")
    .classList.add("active");

  document.getElementById("loginTab")
    .classList.remove("active");

}


/* تماس با Edge Function */

async function authRequest(action,username,password){

  const response = await fetch(AUTH_FUNCTION,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY
    },
    body:JSON.stringify({
      action,
      username,
      password
    })
  });

  let data;

  try{
    data = await response.json();
  }catch{
    throw new Error("پاسخ نامعتبر از سرور دریافت شد.");
  }

  if(!response.ok){
    throw new Error(data.error || "عملیات انجام نشد.");
  }

  return data;
}


/* ثبت نام */

async function signup(){

  const username =
    document.getElementById("signupUsername")
      .value.trim();

  const password =
    document.getElementById("signupPassword")
      .value;

  const password2 =
    document.getElementById("signupPassword2")
      .value;

  const message =
    document.getElementById("signupMessage");

  message.className="error";
  message.textContent="";


  if(!/^[A-Za-z0-9_.-]{3,24}$/.test(username)){

    message.textContent =
      "نام کاربری باید ۳ تا ۲۴ کاراکتر باشد.";

    return;
  }


  if(password.length < 6){

    message.textContent =
      "رمز عبور باید حداقل ۶ کاراکتر باشد.";

    return;
  }


  if(password !== password2){

    message.textContent =
      "تکرار رمز عبور با رمز اصلی یکسان نیست.";

    return;
  }


  try{

    message.textContent =
      "در حال ساخت حساب...";


    const data =
      await authRequest(
        "signup",
        username,
        password
      );


    if(data.session){

      await supabase.auth.setSession({
        access_token:data.session.access_token,
        refresh_token:data.session.refresh_token
      });

    }


    message.className="success";
    message.textContent =
      "حساب با موفقیت ساخته شد.";

    await loadSession();

  }catch(error){

    message.className="error";
    message.textContent =
      error.message || "ثبت نام انجام نشد.";

  }

}


/* ورود */

async function login(){

  const username =
    document.getElementById("loginUsername")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");

  message.textContent="";


  if(!username || !password){

    message.textContent =
      "نام کاربری و رمز عبور را وارد کنید.";

    return;
  }


  try{

    message.textContent =
      "در حال ورود...";


    const data =
      await authRequest(
        "login",
        username,
        password
      );


    await supabase.auth.setSession({
      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token
    });


    await loadSession();

  }catch(error){

    message.textContent =
      error.message ||
      "نام کاربری یا رمز عبور اشتباه است.";

  }

}


/* بررسی session */

async function loadSession(){

  const result =
    await supabase.auth.getSession();

  currentUser =
    result.data.session?.user || null;


  if(!currentUser){

    showAuth();

    return;
  }


  const profile =
    await supabase
      .from("profiles")
      .select("username")
      .eq("id",currentUser.id)
      .maybeSingle();


  currentUsername =
    profile.data?.username ||
    currentUser.user_metadata?.username ||
    "";


  showSite();

  startOnlineSystem();

  await loadProducts();

}


/* نمایش سایت */

function showSite(){

  document
    .getElementById("authSection")
    .classList.add("hidden");

  document
    .getElementById("siteSection")
    .classList.remove("hidden");

  document
    .getElementById("logoutBtn")
    .classList.remove("hidden");

  document
    .getElementById("currentUsername")
    .textContent =
      currentUsername
        ? "👤 " + currentUsername
        : "";

}


/* نمایش صفحه ورود */

function showAuth(){

  document
    .getElementById("authSection")
    .classList.remove("hidden");

  document
    .getElementById("siteSection")
    .classList.add("hidden");

  document
    .getElementById("logoutBtn")
    .classList.add("hidden");

  document
    .getElementById("currentUsername")
    .textContent="";

}


/* خروج */

async function logout(){

  try{

    if(currentUser){

      await supabase
        .from("online_users")
        .delete()
        .eq("user_id",currentUser.id);

    }

    clearInterval(onlineHeartbeat);
    clearInterval(onlineCounterTimer);

    await supabase.auth.signOut();

  }finally{

    currentUser=null;
    showAuth();

  }

}


/* =========================
   ONLINE USERS
========================= */

async function updateOnline(){

  if(!currentUser) return;


  await supabase
    .from("online_users")
    .upsert({
      user_id:currentUser.id,
      last_seen:new Date().toISOString()
    },{
      onConflict:"user_id"
    });

}


async function loadOnlineCount(){

  const cutoff =
    new Date(
      Date.now() -
      2 * 60 * 1000
    ).toISOString();


  const result =
    await supabase
      .from("online_users")
      .select("*",{
        count:"exact",
        head:true
      })
      .gte("last_seen",cutoff);


  if(!result.error){

    document
      .getElementById("onlineCount")
      .textContent =
        result.count || 0;

  }

}


function startOnlineSystem(){

  clearInterval(onlineHeartbeat);
  clearInterval(onlineCounterTimer);


  updateOnline();
  loadOnlineCount();


  onlineHeartbeat =
    setInterval(
      updateOnline,
      60 * 1000
    );


  onlineCounterTimer =
    setInterval(
      loadOnlineCount,
      60 * 1000
    );

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

  const result =
    await supabase
      .from("products")
      .select("*")
      .order("created_at",{
        ascending:false
      });


  if(result.error){

    console.error(result.error);

    return;
  }


  allProducts =
    result.data || [];

  renderProducts();

}


function setCategory(category,button){

  selectedCategory=category;


  document
    .querySelectorAll(".cat")
    .forEach(el =>
      el.classList.remove("active")
    );


  button.classList.add("active");

  renderProducts();

}


function getFallbackImage(category){

  if(category==="آیتم")
    return "item.jpg";

  if(category==="اکانت")
    return "account.png";

  return "";

}


function cleanBaleId(value){

  return String(value || "")
    .trim()
    .replace(/^@+/,"")
    .replace(/[^A-Za-z0-9_.-]/g,"");

}


function baleUrl(value){

  const id =
    cleanBaleId(value);

  if(!id) return "#";

  return "https://ble.ir/" +
    encodeURIComponent(id);

}


function formatPrice(price,type){

  const number =
    Number(price || 0)
      .toLocaleString("fa-IR");

  if(type==="toman")
    return number + " تومان";

  return number + " سکه";

}


function renderProducts(){

  const container =
    document.getElementById("products");

  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const products =
    allProducts.filter(product => {

      const categoryOK =
        selectedCategory==="همه" ||
        product.category===selectedCategory;


      const searchOK =
        !search ||
        String(product.name || "")
          .toLowerCase()
          .includes(search) ||
        String(product.description || "")
          .toLowerCase()
          .includes(search);


      return categoryOK && searchOK;

    });


  if(!products.length){

    container.innerHTML =
      `<div class="empty">
        محصولی پیدا نشد.
      </div>`;

    return;

  }


  container.innerHTML =
    products.map(product => {

      const own =
        currentUser &&
        product.owner_id===currentUser.id;


      const image =
        product.image_url ||
        getFallbackImage(product.category);


      return `
        <article class="product">

          <div class="product-image">

            ${
              image
              ?
              `<img src="${escapeHtml(image)}"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='block';">`
              :
              ""
            }

            <div class="no-image"
                 style="${image ? "" : "display:block"}">
              📦
            </div>

          </div>

          <div class="product-body">

            <span class="badge">
              ${escapeHtml(product.category || "سایر")}
            </span>

            <h3>
              ${escapeHtml(product.name || "بدون نام")}
            </h3>

            <div class="description">
              ${escapeHtml(product.description || "بدون توضیحات")}
            </div>

            <div class="price">
              ${formatPrice(product.price,product.price_type)}
            </div>

            <div class="seller">
              فروشنده:
              ${escapeHtml(product.seller_id || "نامشخص")}
            </div>

            <div class="actions">

              ${
                product.seller_id
                ?
                `<a class="buy"
                   href="${baleUrl(product.seller_id)}"
                   target="_blank"
                   rel="noopener">
                   💬 ارتباط با فروشنده
                 </a>`
                :
                ""
              }

              ${
                own
                ?
                `<button class="delete"
                   onclick="deleteProduct('${product.id}')">
                   حذف
                 </button>`
                :
                ""
              }

            </div>

          </div>

        </article>
      `;

    }).join("");

}


/* ثبت محصول */

async function addProduct(){

  if(!currentUser){

    alert("ابتدا وارد حساب شوید.");

    return;
  }


  const name =
    document.getElementById("productName")
      .value.trim();

  const category =
    document.getElementById("productCategory")
      .value;

  const price =
    Number(
      document.getElementById("productPrice")
        .value
    );

  const priceType =
    document.getElementById("priceType")
      .value;

  const sellerId =
    document.getElementById("sellerId")
      .value.trim();

  const description =
    document.getElementById("productDescription")
      .value.trim();

  const message =
    document.getElementById("productMessage");


  message.textContent="";


  if(!name){

    message.textContent =
      "نام محصول را وارد کنید.";

    return;
  }


  if(!Number.isFinite(price) || price<=0){

    message.textContent =
      "قیمت معتبر وارد کنید.";

    return;
  }


  if(priceType==="coin" && price<500){

    message.textContent =
      "حداقل قیمت سکه ۵۰۰ است.";

    return;
  }


  if(priceType==="toman" && price>500){

    message.textContent =
      "حداکثر قیمت تومان ۵۰۰ است.";

    return;
  }


  if(!sellerId){

    message.textContent =
      "آیدی بله فروشنده را وارد کنید.";

    return;
  }


  const file =
    document.getElementById("productImage")
      .files[0];


  let imageUrl="";


  /*
    برای جلوگیری از وابستگی به Storage،
    تصویر در همین مرورگر به‌صورت Data URL
    ذخیره می‌شود.
    برای نسخه عمومی بهتر است Storage Supabase
    فعال شود.
  */

  if(file){

    if(file.size > 2 * 1024 * 1024){

      message.textContent =
        "حجم تصویر نباید بیشتر از ۲ مگابایت باشد.";

      return;
    }


    imageUrl =
      await fileToDataUrl(file);

  }


  const productData = {

    owner_id:currentUser.id,

    name:name,

    price:Math.floor(price),

    price_type:priceType,

    category:category,

    seller_id:sellerId,

    description:description,

    image_url:imageUrl,

    image_path:""

  };


  const result =
    await supabase
      .from("products")
      .insert(productData);


  if(result.error){

    console.error(result.error);

    message.textContent =
      "ثبت محصول انجام نشد: " +
      result.error.message;

    return;
  }


  message.className="success";

  message.textContent =
    "محصول با موفقیت ثبت شد.";


  document
    .getElementById("productName")
    .value="";

  document
    .getElementById("productPrice")
    .value="";

  document
    .getElementById("sellerId")
    .value="";

  document
    .getElementById("productDescription")
    .value="";

  document
    .getElementById("productImage")
    .value="";


  await loadProducts();

}


/* تبدیل تصویر */

function fileToDataUrl(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload =
      () => resolve(reader.result);

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });

}


/* حذف محصول */

async function deleteProduct(id){

  if(!currentUser) return;


  const ok =
    confirm(
      "مطمئنی می‌خواهی این محصول حذف شود؟"
    );


  if(!ok) return;


  const result =
    await supabase
      .from("products")
      .delete()
      .eq("id",id)
      .eq("owner_id",currentUser.id);


  if(result.error){

    alert(
      "حذف انجام نشد: " +
      result.error.message
    );

    return;
  }


  await loadProducts();

}


/* جلوگیری از HTML Injection */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

);
