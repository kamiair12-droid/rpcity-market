<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP City | Coin Shop</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#08090d;
    color:#fff;
    min-height:100vh;
}

button,input{
    font-family:inherit;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(8,9,13,.92);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #20232d;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:#7c5cff;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    background:#11131a;
    border:1px solid #242735;
    padding:9px 14px;
    border-radius:50px;
    font-size:13px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
}

.dot.online{
    background:#29d17d;
    box-shadow:0 0 12px #29d17d;
}

.hero{
    max-width:1200px;
    margin:40px auto 25px;
    padding:0 20px;
}

.hero-box{
    min-height:260px;
    border-radius:25px;
    padding:45px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    overflow:hidden;
    position:relative;
    background:
      radial-gradient(circle at 80% 20%,#654cff55,transparent 35%),
      linear-gradient(135deg,#15101f,#0d1018);
    border:1px solid #2b2542;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero p{
    color:#aaaebe;
    line-height:2;
}

.hero-badge{
    margin-top:20px;
    display:inline-block;
    padding:10px 17px;
    border-radius:12px;
    background:#7c5cff;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px 60px;
}

.toolbar{
    display:flex;
    gap:12px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:220px;
    background:#11131a;
    color:white;
    border:1px solid #292d39;
    padding:14px 17px;
    border-radius:13px;
    outline:none;
}

.search:focus{
    border-color:#7c5cff;
}

.admin{
    background:#151722;
    border:1px solid #303442;
    color:white;
    padding:13px 18px;
    border-radius:13px;
    cursor:pointer;
}

.admin:hover{
    border-color:#7c5cff;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:18px;
}

.card{
    background:#11131a;
    border:1px solid #242733;
    border-radius:20px;
    overflow:hidden;
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#51418f;
}

.banner{
    height:105px;
    background:#181b25;
    overflow:hidden;
}

.banner img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-image{
    width:120px;
    height:120px;
    border-radius:20px;
    object-fit:cover;
    display:block;
    margin:-55px auto 10px;
    position:relative;
    border:5px solid #11131a;
    background:#181b25;
}

.card-body{
    padding:15px 18px 20px;
    text-align:center;
}

.card h3{
    font-size:18px;
    margin-bottom:9px;
}

.desc{
    color:#8f94a5;
    font-size:13px;
    min-height:40px;
    line-height:1.8;
}

.price{
    color:#8d74ff;
    font-size:21px;
    font-weight:900;
    margin:15px 0;
}

.buy{
    width:100%;
    border:0;
    background:#7c5cff;
    color:#fff;
    padding:13px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.buy:hover{
    background:#6948ff;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#858a9b;
    padding:60px;
    background:#11131a;
    border:1px dashed #303442;
    border-radius:18px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(7px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:570px;
    max-height:90vh;
    overflow:auto;
    background:#11131a;
    border:1px solid #303442;
    border-radius:22px;
    padding:25px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    background:#1b1e28;
    border:0;
    color:white;
    width:38px;
    height:38px;
    border-radius:10px;
    cursor:pointer;
    font-size:20px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    color:#b9bdca;
    margin-bottom:8px;
    font-size:13px;
}

.form-group input,
.form-group textarea{
    width:100%;
    background:#090b10;
    border:1px solid #2c303d;
    color:white;
    border-radius:11px;
    padding:13px;
    outline:none;
}

.form-group textarea{
    resize:vertical;
    min-height:90px;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#7c5cff;
}

.upload{
    border:1px dashed #3b4050;
    border-radius:12px;
    padding:17px;
    text-align:center;
    cursor:pointer;
    color:#9298a8;
}

.upload:hover{
    border-color:#7c5cff;
    color:white;
}

.preview{
    display:none;
    width:100%;
    max-height:180px;
    object-fit:cover;
    margin-top:10px;
    border-radius:12px;
}

.form-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.save{
    flex:1;
    border:0;
    background:#7c5cff;
    color:white;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.cancel{
    flex:1;
    border:1px solid #303442;
    background:#171a22;
    color:white;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
}

.delete-btn{
    width:100%;
    margin-top:10px;
    background:#2a1418;
    color:#ff6978;
    border:1px solid #54232b;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
}

footer{
    border-top:1px solid #20232d;
    color:#707585;
    text-align:center;
    padding:25px;
    font-size:13px;
}

@media(max-width:650px){
    .hero-box{
        padding:30px 22px;
    }

    .hero h1{
        font-size:30px;
    }

    .hero-box{
        min-height:230px;
    }

    .nav{
        padding:14px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="nav">
        <div class="logo">
            RP <span>CITY</span>
        </div>

        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="pingText">در حال بررسی...</span>
        </div>
    </div>
</header>

<section class="hero">
    <div class="hero-box">
        <div>
            <h1>RP City Shop</h1>
            <p>
                فروش سریع و مطمئن سکه‌های RP City
                <br>
                محصولات موردنظرت رو انتخاب کن.
            </p>

            <span class="hero-badge">🪙 Coin Shop</span>
        </div>
    </div>
</section>

<main class="container">

    <div class="toolbar">
        <input
            class="search"
            id="search"
            type="text"
            placeholder="🔎 جستجوی محصول..."
        >

        <button class="admin" onclick="openAdmin()">
            ⚙️ مدیریت محصولات
        </button>
    </div>

    <div class="products" id="products"></div>

</main>

<footer>
    © 2026 RP City Shop — تمامی حقوق محفوظ است.
</footer>


<!-- ADMIN MODAL -->

<div class="modal" id="adminModal">
    <div class="modal-box">

        <div class="modal-head">
            <h2 id="modalTitle">افزودن محصول</h2>
            <button class="close" onclick="closeAdmin()">×</button>
        </div>

        <input type="hidden" id="editId">

        <div class="form-group">
            <label>نام محصول</label>
            <input id="productName" placeholder="مثلاً 50K Coin">
        </div>

        <div class="form-group">
            <label>قیمت</label>
            <input id="productPrice" placeholder="مثلاً 10000 تومان">
        </div>

        <div class="form-group">
            <label>توضیحات</label>
            <textarea id="productDesc" placeholder="توضیحات محصول..."></textarea>
        </div>

        <div class="form-group">
            <label>عکس محصول</label>

            <label class="upload">
                📷 انتخاب عکس محصول
                <input
                    id="productImage"
                    type="file"
                    accept="image/*"
                    hidden
                    onchange="previewImage(this,'imagePreview')"
                >
            </label>

            <img id="imagePreview" class="preview">
        </div>

        <div class="form-group">
            <label>بنر محصول</label>

            <label class="upload">
                🖼️ انتخاب بنر محصول
                <input
                    id="productBanner"
                    type="file"
                    accept="image/*"
                    hidden
                    onchange="previewImage(this,'bannerPreview')"
                >
            </label>

            <img id="bannerPreview" class="preview">
        </div>

        <div class="form-buttons">
            <button class="save" onclick="saveProduct()">
                💾 ذخیره محصول
            </button>

            <button class="cancel" onclick="closeAdmin()">
                انصراف
            </button>
        </div>

        <button
            id="deleteProduct"
            class="delete-btn"
            onclick="deleteProduct()"
            style="display:none"
        >
            🗑️ حذف محصول
        </button>

    </div>
</div>


<script>

/* =========================
   DEFAULT PRODUCTS
========================= */

const defaultProducts = [
    {
        id: crypto.randomUUID(),
        name:"50K Coin",
        price:"10,000 تومان",
        desc:"بسته 50 هزار سکه RP City",
        image:"",
        banner:""
    },
    {
        id: crypto.randomUUID(),
        name:"100K Coin",
        price:"20,000 تومان",
        desc:"بسته 100 هزار سکه RP City",
        image:"",
        banner:""
    },
    {
        id: crypto.randomUUID(),
        name:"200K Coin",
        price:"40,000 تومان",
        desc:"بسته 200 هزار سکه RP City",
        image:"",
        banner:""
    }
];


/* =========================
   STORAGE
========================= */

let products = JSON.parse(
    localStorage.getItem("rpcity_products")
);

if(!products){
    products = defaultProducts;
    localStorage.setItem(
        "rpcity_products",
        JSON.stringify(products)
    );
}


/* =========================
   RENDER
========================= */

function renderProducts(){

    const box = document.getElementById("products");

    const query =
        document.getElementById("search").value
        .trim()
        .toLowerCase();

    const filtered = products.filter(p =>
        p.name.toLowerCase().includes(query) ||
        p.desc.toLowerCase().includes(query)
    );

    box.innerHTML = "";

    if(filtered.length === 0){

        box.innerHTML = `
            <div class="empty">
                محصولی پیدا نشد.
            </div>
        `;

        return;
    }

    filtered.forEach(product => {

        const card = document.createElement("article");

        card.className = "card";

        card.innerHTML = `

            <div class="banner">
                ${
                    product.banner
                    ? `<img src="${product.banner}" alt="">`
                    : ""
                }
            </div>

            ${
                product.image
                ? `<img class="product-image"
                        src="${product.image}"
                        alt="${escapeHTML(product.name)}">`
                : `<div class="product-image"></div>`
            }

            <div class="card-body">

                <h3>
                    ${escapeHTML(product.name)}
                </h3>

                <div class="desc">
                    ${escapeHTML(product.desc)}
                </div>

                <div class="price">
                    ${escapeHTML(product.price)}
                </div>

                <button
                    class="buy"
                    onclick="buyProduct('${product.id}')"
                >
                    🛒 خرید محصول
                </button>

                <button
                    class="admin"
                    style="width:100%;margin-top:8px;"
                    onclick="editProduct('${product.id}')"
                >
                    ✏️ ویرایش
                </button>

            </div>
        `;

        box.appendChild(card);
    });
}


function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   ADMIN
========================= */

function openAdmin(){

    resetForm();

    document
        .getElementById("adminModal")
        .classList.add("show");
}

function closeAdmin(){

    document
        .getElementById("adminModal")
        .classList.remove("show");

    resetForm();
}

function resetForm(){

    document.getElementById("editId").value = "";

    document.getElementById("productName").value = "";

    document.getElementById("productPrice").value = "";

    document.getElementById("productDesc").value = "";

    document.getElementById("productImage").value = "";

    document.getElementById("productBanner").value = "";

    document.getElementById("imagePreview").style.display = "none";

    document.getElementById("bannerPreview").style.display = "none";

    document.getElementById("imagePreview").src = "";

    document.getElementById("bannerPreview").src = "";

    document.getElementById("modalTitle").textContent =
        "افزودن محصول";

    document.getElementById("deleteProduct").style.display =
        "none";
}


/* =========================
   FILE TO BASE64
========================= */

function fileToBase64(file){

    return new Promise((resolve,reject)=>{

        if(!file){
            resolve("");
            return;
        }

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}


/* =========================
   PREVIEW
========================= */

function previewImage(input,targetId){

    const file = input.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const img =
            document.getElementById(targetId);

        img.src = e.target.result;

        img.style.display = "block";
    };

    reader.readAsDataURL(file);
}


/* =========================
   SAVE
========================= */

async function saveProduct(){

    const name =
        document.getElementById("productName")
        .value.trim();

    const price =
        document.getElementById("productPrice")
        .value.trim();

    const desc =
        document.getElementById("productDesc")
        .value.trim();

    const editId =
        document.getElementById("editId")
        .value;

    if(!name || !price){

        alert("نام محصول و قیمت را وارد کن.");

        return;
    }

    const imageFile =
        document.getElementById("productImage")
        .files[0];

    const bannerFile =
        document.getElementById("productBanner")
        .files[0];

    let image = "";

    let banner = "";

    if(editId){

        const old =
            products.find(p => p.id === editId);

        image = old?.image || "";

        banner = old?.banner || "";
    }

    if(imageFile){

        image = await fileToBase64(imageFile);
    }

    if(bannerFile){

        banner = await fileToBase64(bannerFile);
    }

    const product = {

        id: editId || crypto.randomUUID(),

        name,

        price,

        desc,

        image,

        banner
    };

    if(editId){

        const index =
            products.findIndex(p => p.id === editId);

        products[index] = product;

    }else{

        products.push(product);
    }

    localStorage.setItem(
        "rpcity_products",
        JSON.stringify(products)
    );

    renderProducts();

    closeAdmin();
}


/* =========================
   EDIT
========================= */

function editProduct(id){

    const product =
        products.find(p => p.id === id);

    if(!product) return;

    document.getElementById("editId").value =
        product.id;

    document.getElementById("productName").value =
        product.name;

    document.getElementById("productPrice").value =
        product.price;

    document.getElementById("productDesc").value =
        product.desc;

    if(product.image){

        const img =
            document.getElementById("imagePreview");

        img.src = product.image;

        img.style.display = "block";
    }

    if(product.banner){

        const img =
            document.getElementById("bannerPreview");

        img.src = product.banner;

        img.style.display = "block";
    }

    document.getElementById("modalTitle").textContent =
        "ویرایش محصول";

    document.getElementById("deleteProduct").style.display =
        "block";

    document
        .getElementById("adminModal")
        .classList.add("show");
}


/* =========================
   DELETE
========================= */

function deleteProduct(){

    const id =
        document.getElementById("editId").value;

    if(!id) return;

    if(!confirm("این محصول حذف شود؟")) return;

    products =
        products.filter(p => p.id !== id);

    localStorage.setItem(
        "rpcity_products",
        JSON.stringify(products)
    );

    renderProducts();

    closeAdmin();
}


/* =========================
   BUY
========================= */

function buyProduct(id){

    const product =
        products.find(p => p.id === id);

    if(!product) return;

    /*
       اینجا می‌توانی لینک خرید،
       آیدی روبیکا یا درگاه پرداخت
       خودت را قرار بدهی.
    */

    alert(
        "محصول انتخاب شد:\n\n" +
        product.name +
        "\n" +
        product.price
    );
}


/* =========================
   SEARCH
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderProducts
    );


/* =========================
   REAL NETWORK PING
========================= */

/*
   نکته:
   مرورگر اجازه ICMP Ping مستقیم نمی‌دهد.
   این روش زمان رفت‌وبرگشت یک HTTP Request
   به سرور را اندازه می‌گیرد.
*/

async function checkPing(){

    const pingText =
        document.getElementById("pingText");

    const dot =
        document.getElementById("statusDot");

    const start =
        performance.now();

    try{

        await fetch(
            window.location.origin +
            "/?ping=" +
            Date.now(),
            {
                method:"HEAD",
                cache:"no-store"
            }
        );

        const end =
            performance.now();

        const ms =
            Math.round(end - start);

        pingText.textContent =
            "Ping: " + ms + " ms";

        dot.classList.add("online");

    }catch(error){

        pingText.textContent =
            "اتصال نامشخص";

        dot.classList.remove("online");
    }
}


/* =========================
   START
========================= */

renderProducts();

checkPing();

setInterval(
    checkPing,
    10000
);

</script>

</body>
</html>
