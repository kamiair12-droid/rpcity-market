<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RP City Market</title>

  <meta name="theme-color" content="#07111f">
  <meta name="description" content="بازار خرید و فروش آیتم های RP City">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      font-family:
        Tahoma,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at top right,
          rgba(0,120,255,.16),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(0,255,170,.08),
          transparent 35%
        ),
        #050b14;
      color:#fff;
    }

    button,
    input,
    select,
    textarea{
      font-family:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .container{
      width:min(1180px,92%);
      margin:auto;
    }

    /* =========================
       HEADER
    ========================= */

    header{
      position:sticky;
      top:0;
      z-index:1000;
      backdrop-filter:blur(18px);
      background:rgba(4,10,18,.78);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .nav{
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:20px;
      font-weight:900;
      letter-spacing:1px;
    }

    .brand-logo{
      width:42px;
      height:42px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        linear-gradient(
          135deg,
          #00e5ff,
          #1677ff
        );
      box-shadow:
        0 0 25px rgba(0,180,255,.3);
    }

    .brand-logo span{
      font-size:19px;
      font-weight:1000;
    }

    .ping-box{
      display:flex;
      align-items:center;
      gap:8px;
      padding:9px 13px;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(255,255,255,.035);
      border-radius:14px;
      color:#d8e4f0;
      font-size:12px;
    }

    .ping-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#00e676
