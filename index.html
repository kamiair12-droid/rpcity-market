<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RP CITY MARKET</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#070a10;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.wrap{
  width:min(1120px,92%);
  margin:auto;
}

/* AUTH */

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at top,#172238,#070a10 55%);
}

.authbox{
  width:min(430px,100%);
  padding:26px;
  background:#0e1420;
  border:1px solid #25324a;
  border-radius:22px;
  box-shadow:0 15px 50px #0008;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:6px;
}

.sub{
  text-align:center;
  color:#93a1b8;
  margin-bottom:22px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.tabs button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px;
  background:#151e2e;
  color:#aab6ca;
}

.tabs .active{
  background:#f2b400;
  color:#111;
  font-weight:900;
}

label{
  display:block;
  color:#aab6ca;
  font-size:13px;
  margin:12px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px 14px;
  background:#080d15;
  border:1px solid #2a3850;
  color:#fff;
  border-radius:12px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#f2b400;
}

textarea{
  min-height:95px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:linear-gradient(135deg,#ffd34d,#e49b00);
  color:#151515;
  font-weight:900;
  margin-top:16px;
}

.msg{
  min-height:22px;
  color:#ff7777;
  text-align:center;
  margin-top:12px;
  font-size:13px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#080c13ee;
  backdrop-filter:blur(12px);
  border-bottom:1px solid #1d2737;
}

.nav{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  font-weight:1000;
  font-size:20px;
}

.user{
  color:#aab6ca;
  font-size:13px;
}

.actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.small{
  border:1px solid #2b3a53;
  background:#101827;
  color:#fff;
  border-radius:10px;
  padding:9px 12px;
}

.ping{
  color:#69e6a8;
  font-size:12px;
}

/* HERO */

.hero{
  padding:42px 0 22px;
  text-align:center;
}

.hero h1{
  font-size:clamp(30px,6vw,58px);
  margin:0 0 10px;
}

.hero p{
  color:#91a0b7;
  margin:0;
}

/* MAIN */

.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:18px;
  align-items:start;
}

.panel,
.card,
.support{
  background:#0e1420;
  border:1px solid #25324a;
  border-radius:22px;
  box-shadow:0 15px 50px #0005;
}

.panel{
  padding:20px;
}

.panel h2{
  margin:0 0 14px;
  font-size:19px;
}

.filters{
  display:grid;
  grid-template-columns:1fr 170px;
  gap:10px;
  margin-bottom:16px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

/* CARD */

.card{
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.pic{
  width:100%;
  aspect-ratio:1.45;
  object-fit:cover;
  background:#121a28;
}

.body{
  padding:15px;
}

.tag{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#18243a;
  color:#ffd34d;
  font-size:11px;
  margin-bottom:9px;
}

.card h3{
  margin:0 0 8px;
  font-size:18px;
}

.desc{
  color:#aab6ca;
  font-size:13px;
  line-height:1.8;
  min-height:25px;
}

.price{
  font-size:18px;
  font-weight:900;
  margin:12px 0;
}

.seller{
  font-size:12px;
  color:#93a1b8;
  margin-bottom:12px;
}

.card-actions{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

.bale{
  border:0;
  border-radius:11px;
  padding:11px;
  background:#1476ff;
  color:#fff;
  font-weight:900;
  text-align:center;
  text-decoration:none;
}

.delete{
  border:1px solid #69363d;
  background:#221116;
  color:#ff8994;
  border-radius:11px;
  padding:11px;
}

/* SUPPORT */

.support{
  margin:26px 0;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:linear-gradient(135deg,#111c2d,#0c111a);
}

.support strong{
  font-size:18px;
}

.support p{
  margin:5px 0 0;
  color:#91a0b7;
  font-size:13px;
}

.support a{
  display:inline-block;
  text-decoration:none;
  background:#f2b400;
  color:#111;
  font-weight:900;
  border-radius:12px;
  padding:12px 16px;
  white-space:nowrap;
}

footer{
  text-align:center;
  color:#64738a;
  padding:24px 0 35px;
  font-size:12px;
}

@media(max-width:850px){

  .grid{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .support{
    flex-direction:column;
    align-items:stretch;
  }

  .support a{
    text-align:center;
  }
}
</style>
</head>

<body>

</span>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
'https://cjntwmohtwbfqtxlgxrt.supabase.co';

const SUPABASE_KEY =
'sb_publishable_mvO9kjx83dBLbsea0C7sAg_O4hHBRL9';

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:false
}
}
);


/* =========================
   VARIABLES
========================= */

let mode='login';

let currentUser=null;

let allProducts=[];


/* =========================
   HELPERS
========================= */

const $ = id =>
document.getElementById(id);


function validUsername(username){

return /^[A-Za-z0-9_]{3,20}$/
.test(username.trim());

}


function authEmail(username){

return username
.trim()
.toLowerCase()
+
'@rpcitymarket.com';

}


function cleanBaleId(value){

return value
.trim()
.replace(/^@+/,'')
.replace(/[^A-Za-z0-9_.-]/g,'');

}


function baleUrl(value){

const id=cleanBaleId(value);

if(!id)
return '#';

return
'https://ble.ir/'
+
encodeURIComponent(id);

}


function formatNumber(number){

return Number(number)
.toLocaleString('fa-IR');

}


function categoryLabel(category){

const labels={

'سکه':'🪙 سکه',

'آیتم':'🎒 آیتم',

'اکانت':'👤 اکانت',

'سایر':'📦 سایر'

};

return labels[category] || category;

}


function escapeHtml(value){

return String(value ?? '')
.replace(/[&<>"']/g,function(s){

return {

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[s];

});

}


/* =========================
   AUTH ERROR
========================= */

function translateAuthError(error){

const message=
(error?.message || '')
.toLowerCase();

if(
message.includes('invalid login credentials')
){

return 'نام کاربری یا رمز عبور اشتباه است.';

}

if(
message.includes('already registered') ||
message.includes('user already registered')
){

return 'این نام کاربری قبلاً ثبت شده است.';

}

if(message.includes('email')){

return 'ساخت حساب انجام نشد؛ تنظیمات Email Auth پروژه Supabase را بررسی کنید.';

}

return error?.message ||
'خطایی رخ داد.';

}


/* =========================
   AUTH MODE
========================= */

function setAuthMode(next){

mode=next;

$('loginTab')
.classList
.toggle(
'active',
mode==='login'
);

$('signupTab')
.classList
.toggle(
'active',
mode==='signup'
);

$('authButton').textContent =
mode==='login'
?
'ورود به حساب'
:
'ساخت حساب و ورود';

$('authMsg').textContent='';

$('authPassword').autocomplete =
mode==='login'
?
'current-password'
:
'new-password';

}


$('loginTab').onclick=
()=>setAuthMode('login');


$('signupTab').onclick=
()=>setAuthMode('signup');


/* =========================
   LOGIN / SIGNUP
========================= */

$('authForm')
.addEventListener(
'submit',
async function(event){

event.preventDefault();

const username=
$('authUsername')
.value
.trim();

const password=
$('authPassword')
.value;

$('authMsg').textContent='';

if(!validUsername(username)){

$('authMsg').textContent=
'نام کاربری باید ۳ تا ۲۰ کاراکتر انگلیسی، عدد یا _ باشد.';

return;

}

if(password.length<6){

$('authMsg').textContent=
'رمز عبور باید حداقل ۶ کاراکتر باشد.';

return;

}

$('authButton').disabled=true;

try{

let result;

if(mode==='signup'){

result=
await supabase.auth.signUp({

email:authEmail(username),

password:password,

options:{
data:{
username:username
}
}

});

if(result.error)
throw result.error;

if(!result.data.session){

$('authMsg').textContent=
'حساب ساخته شد. اگر وارد نشد، تنظیمات Confirm email در Supabase را بررسی کنید.';

}

}else{

result=
await supabase.auth.signInWithPassword({

email:authEmail(username),

password:password

});

if(result.error)
throw result.error;

}

}catch(error){

$('authMsg').textContent=
translateAuthError(error);

}finally{

$('authButton').disabled=false;

}

}
);


/* =========================
   SHOW APP
========================= */

async function showApp(session){

currentUser=session.user;

const username=
currentUser.user_metadata?.username
||
(currentUser.email || '')
.split('@')[0];

$('currentUsername').textContent=
'@'+username;

$('authScreen')
.classList
.add('hidden');

$('app')
.classList
.remove('hidden');

await loadProducts();

updatePing();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

await supabase.auth.signOut();

location.reload();

}

$('logoutBtn').onclick=logout;


/* =========================
   IMAGES
========================= */

/*
برای عکس‌های دسته‌بندی:

item.jpg = عکس آیتم
account.png = عکس اکانت

بعداً می‌توانی:
coin.jpg
other.jpg

را هم اضافه کنی.
*/

const fallbackImages={

'آیتم':'item.jpg',

'اکانت':'account.png',

'سکه':'',

'سایر':''

};


function imageForProduct(product){

return
product.image_url
||
fallbackImages[product.category]
||
'';

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

const {
data,
error
}=await supabase
.from('products')
.select('*')
.order(
'created_at',
{
ascending:false
}
);

if(error){

$('products').innerHTML=
`
<div
class="panel"
style="
grid-column:1/-1;
color:#ff7777
"
>
خطا در دریافت محصولات:
${escapeHtml(error.message)}
</div>
`;

return;

}

allProducts=data || [];

renderProducts();

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

const query=
$('search')
.value
.trim()
.toLowerCase();

const category=
$('filterCategory')
.value;

const list=
allProducts.filter(
product=>{

const text=
`
${product.name || ''}
${product.description || ''}
${product.seller_id || ''}
`
.toLowerCase();

return

(!query ||
text.includes(query))

&&

(!category ||
product.category===category);

}
);

const box=$('products');

if(!list.length){

box.innerHTML=
`
<div
class="panel"
style="
grid-column:1/-1;
text-align:center;
color:#91a0b7
"
>
محصولی پیدا نشد.
</div>
`;

return;

}

box.innerHTML=
list
.map(createCard)
.join('');

}


/* =========================
   PRODUCT CARD
========================= */

function createCard(product){

const image=
imageForProduct(product);

let imageHTML='';

if(image){

imageHTML=
`
<img
class="pic"
src="${escapeHtml(image)}"
alt=""
>
`;

}else{

imageHTML=
`
<div class="pic"></div>
`;

}

const isMine=
currentUser &&
product.owner_id===
currentUser.id;

const priceUnit=
product.price_type==='coin'
?
'🪙 سکه'
:
'💰 تومان';

return `
<article class="card">

${imageHTML}

<div class="body">

<span class="tag">
${categoryLabel(product.category)}
</span>

<h3>
${escapeHtml(product.name)}
</h3>

<div class="desc">
${escapeHtml(product.description || '')}
</div>

<div class="price">
${formatNumber(product.price)}
${priceUnit}
</div>

<div class="seller">

👤 فروشنده:

${escapeHtml(
product.seller_id
?
'@'+cleanBaleId(product.seller_id)
:
'—'
)}

</div>

<div class="card-actions">

<a
class="bale"
href="${baleUrl(product.seller_id)}"
target="_blank"
rel="noopener"
>
💬 پیام به فروشنده
</a>

${
isMine
?
`
<button
class="delete"
onclick="deleteProduct('${product.id}')"
>
حذف
</button>
`
:
''
}

</div>

</div>

</article>
`;

}


/* =========================
   ADD PRODUCT
========================= */

$('productForm')
.addEventListener(
'submit',
async function(event){

event.preventDefault();

$('productMsg').textContent='';

if(!currentUser)
return;

const name=
$('name')
.value
.trim();

const price=
Number(
$('price')
.value
);

const priceType=
$('priceType')
.value;

const category=
$('category')
.value;

const baleId=
cleanBaleId(
$('baleId')
.value
);

const description=
$('description')
.value
.trim();


if(!name){

$('productMsg').textContent=
'نام محصول را وارد کن.';

return;

}


if(
!Number.isInteger(price) ||
price<=0
){

$('productMsg').textContent=
'قیمت معتبر وارد کن.';

return;

}


/* حداقل 500 سکه */

if(
priceType==='coin' &&
price<500
){

$('productMsg').textContent=
'حداقل قیمت سکه ۵۰۰ سکه است.';

return;

}


/* حداکثر 500 تومان */

if(
priceType==='toman' &&
price>500
){

$('productMsg').textContent=
'حداکثر قیمت تومان ۵۰۰ تومان است.';

return;

}


if(!baleId){

$('productMsg').textContent=
'آیدی پی‌وی بله را وارد کن.';

return;

}


const button=
event.submitter;

button.disabled=true;


try{

const productData={

owner_id:
currentUser.id,

name:name,

price:
Math.floor(price),

price_type:
priceType,

category:
category,

seller_id:
baleId,

description:
description,

image_url:'',

image_path:''

};


const {
error
}=
await supabase
.from('products')
.insert(productData);


if(error)
throw error;


event.target.reset();


$('productMsg').style.color=
'#69e6a8';

$('productMsg').textContent=
'محصول با موفقیت ثبت شد.';


await loadProducts();


}catch(error){

$('productMsg').style.color=
'#ff7777';

$('productMsg').textContent=
error.message ||
'ثبت محصول ناموفق بود.';

}finally{

button.disabled=false;

}

}
);


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

if(
!confirm(
'این محصول حذف شود؟'
)
)
return;


const {
error
}=
await supabase
.from('products')
.delete()
.eq('id',id)
.eq('owner_id',currentUser.id);


if(error){

alert(error.message);

return;

}


await loadProducts();

}


window.deleteProduct=
deleteProduct;


/* =========================
   SEARCH
========================= */

$('search')
.addEventListener(
'input',
renderProducts
);


$('filterCategory')
.addEventListener(
'change',
renderProducts
);


/* =========================
   PING
========================= */

async function updatePing(){

const start=
performance.now();

const {
error
}=
await supabase
.from('products')
.select(
'id',
{
head:true,
count:'exact'
}
);

const ms=
Math.round(
performance.now()-start
);

$('ping').textContent=
error
?
'Ping: —'
:
`Ping: ${ms}ms`;

}


/* =========================
   AUTO REFRESH
========================= */

setInterval(
updatePing,
10000
);

setInterval(
loadProducts,
30000
);


/* =========================
   INIT
========================= */

async function init(){

const {
data
}=
await supabase.auth.getSession();

if(data.session){

await showApp(
data.session
);

}

}


supabase.auth.onAuthStateChange(
function(event,session){

if(
session &&
!currentUser
){

showApp(session);

}

}
);


init();

</script>
